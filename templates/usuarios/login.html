{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="tarjeta tarjeta-form">
        <div class="text-center mb-4">
          <span class="marca-icono marca-icono-lg"><i class="bi bi-controller"></i></span>
          <h1 class="h3 mt-3">Iniciar sesión</h1>
          <p class="text-secundario">Volvé a la arena</p>
        </div>
        <form method="post" novalidate>
          {{ csrf() }}
          <div class="mb-3">
            <label class="form-label" for="identificador">Usuario o correo electrónico</label>
            <input class="form-control" id="identificador" name="identificador" value="{{ identificador }}" required autofocus autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
              <button class="btn btn-outline-secondary js-ver-password" type="button" data-objetivo="password" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="recordar" name="recordar">
            <label class="form-check-label" for="recordar">Recordarme</label>
          </div>
          <button class="btn btn-rojo w-100 btn-lg" type="submit">Entrar</button>
        </form>
        <div class="text-center text-secundario my-3">o</div>
        <a class="btn w-100 d-flex justify-content-center align-items-center" style="background:#171a21;color:#fff;border:1px solid #2a475e" href="{{ url_for('usuarios.steam_login') }}">
          <img src="https://community.cloudflare.steamstatic.com/public/images/signinthroughsteam/sits_01.png" alt="Sign in through Steam" style="height:38px">
        </a>
        <p class="text-center mt-4 mb-0 text-secundario">¿No tenés cuenta? <a href="{{ url_for('usuarios.registro') }}">Registrate</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
