{% extends "base.html" %}
{% block titulo %}Error {{ codigo }}{% endblock %}
{% block contenido %}
<div class="container">
  <div class="vacio error-pagina">
    <div class="error-codigo text-gradiente">{{ codigo }}</div>
    <p class="lead">{{ mensaje }}</p>
    <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-rojo"><i class="bi bi-house"></i> Volver al inicio</a>
      <a href="{{ url_for('torneos.lista') }}" class="btn btn-fantasma"><i class="bi bi-trophy"></i> Ver torneos</a>
    </div>
  </div>
</div>
{% endblock %}
